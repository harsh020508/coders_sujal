<!DOCTYPE html>
<html class="scroll-smooth" lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <meta name="description" content="LocalKaam — Hyperlocal help for Mumbai homes. Verified local pros, direct prices, 0% commission.">
  <meta property="og:title" content="LocalKaam — Good help lives on your street.">
  <meta property="og:description" content="Verified pros in your locality. Direct prices, 0% commission, ~25 min arrival.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <meta name="theme-color" id="theme-color-meta" content="#fbf9f4">
  <script>
    // Apply the saved theme/accent before first paint to avoid a light flash
    // for returning dark-mode users. settingsService.js owns the full logic
    // and corrects this once the app boots.
    (function () {
      try {
        var pref = 'light';
        var raw = localStorage.getItem('localkaam_settings_v2');
        if (raw) {
          var parsed = JSON.parse(raw);
          pref = (parsed && parsed.appearance && parsed.appearance.theme) || pref;
        } else {
          var legacy = localStorage.getItem('localkaam_theme');
          if (legacy === 'dark' || legacy === 'light') pref = legacy;
        }
        var resolved = pref;
        if (pref === 'system') {
          resolved = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        if (resolved !== 'dark' && resolved !== 'light') resolved = 'light';
        document.documentElement.setAttribute('data-theme', resolved);
        document.documentElement.style.colorScheme = resolved;
        var meta = document.getElementById('theme-color-meta');
        if (meta) meta.setAttribute('content', resolved === 'dark' ? '#0f120e' : '#fbf9f4');
      } catch (e) {}
    })();
  </script>
  <title>LocalKaam — Hyperlocal Blue-Collar Services Marketplace</title>

<body>
  <noscript>
    <div style="padding: 24px; max-width: 600px; margin: 40px auto; background: #fffbeb; border: 1.5px solid #fde68a; border-radius: 12px; font-family: Inter, sans-serif; color: #1a3300; text-align: center;">
      <h2 style="font-size: 1.25rem; font-weight: 800; margin-bottom: 8px;">JavaScript is Required for LocalKaam</h2>
      <p style="font-size: 0.95rem; line-height: 1.6; color: #44483d; margin: 0;">
        LocalKaam is an interactive hyperlocal services marketplace connecting Mumbai households with verified local specialists. Please enable JavaScript in your browser to browse professionals, schedule jobs, and track services live.
      </p>
    </div>
  </noscript>
  <div id="app" class="app-container"></div>

  <script type="module">
    import { App } from './app.js';
    import { autoRefreshIcons } from './icons.js';
    import { SupabaseService } from './supabaseClient.js';
    import { AuthService } from './authService.js';
    import { StorageService } from './storage.js';
    import { Toast } from './toast.js';
    import { NotificationService } from './notificationService.js';

    window.NotificationService = NotificationService;

    // Global helper to refresh Lucide icons whenever DOM updates
    window.refreshIcons = () => {
      try {
        if (typeof lucide !== 'undefined' && lucide.createIcons) {
          lucide.createIcons();
        }
      } catch (e) {
        console.warn('Lucide icon refresh warning:', e);
      }
    };

    async function boot() {
      try {
        const hash = window.location.hash || '';
        const search = window.location.search || '';
        const isOAuth = hash.includes('access_token') || hash.includes('error') ||
                        search.includes('code=') || search.includes('error=');
        if (isOAuth) {
          let oauthTargetRole = null;
          let oauthError = null;
          const appDiv = document.getElementById('app');
          if (appDiv) {
            appDiv.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:Inter,sans-serif;"><div style="font-size:2.5rem;margin-bottom:1rem;">⏳</div><p style="font-size:1.1rem;font-weight:600;color:var(--text-primary);">Completing Secure Sign-In...</p></div>';
          }
          // Explicit PKCE exchange + role resolution. getSession() alone
          // never produces a session for ?code= callbacks, which previously
          // dropped the user back on the landing page.
          try {
            const result = await AuthService.handleOAuthCallback();
            if (result && result.session) {
              oauthTargetRole = result.targetRole || 'customer';
              StorageService.setCurrentRole(oauthTargetRole);
              Toast.show('Signed in as ' + (result.session.user?.email || 'User') + '!', 'success');
            } else {
              oauthError = result && result.error ? result.error : new Error('Sign-in could not be completed. Please try again.');
            }
          } catch (err) {
            console.error('OAuth callback processing error:', err);
            oauthError = err;
          }
          if (oauthError && !oauthTargetRole) {
            // Never strand the user on the landing page after a Google
            // attempt: fall back to the chosen role's demo session so
            // customer/worker pages stay reachable even if exchange fails.
            let fallbackRole = null;
            try {
              const p = localStorage.getItem('localkaam_pending_auth_role');
              if (p === 'worker' || p === 'customer') fallbackRole = p;
            } catch (e) {}
            if (fallbackRole) {
              try {
                AuthService.loginGuest(fallbackRole);
                StorageService.setCurrentRole(fallbackRole);
                oauthTargetRole = fallbackRole;
                try { localStorage.removeItem('localkaam_pending_auth_role'); } catch (e) {}
                Toast.show(`Google sign-in could not complete — entered ${fallbackRole} demo mode so you can continue.`, 'warning');
                console.warn('[Auth] OAuth failed, fell back to guest', fallbackRole, oauthError.message || oauthError);
              } catch (e) {
                Toast.show('Sign-in failed: ' + (oauthError.message || 'please try again'), 'error');
              }
            } else {
              Toast.show('Sign-in failed: ' + (oauthError.message || 'please try again'), 'error');
            }
          }
          if (window.history && window.history.replaceState) {
            window.history.replaceState(null, '', window.location.pathname + (oauthTargetRole ? '#' + oauthTargetRole : ''));
          }
        }
      } catch (e) {}

      try {
        autoRefreshIcons(document.body);
        App.init();
        window.refreshIcons();
      } catch (err) {
        console.error('App init fatal error:', err);
        const appDiv = document.getElementById('app');
        if (appDiv) {
          appDiv.innerHTML = '<div style="padding: 3rem; text-align: center; font-family: Inter, sans-serif;"><h2>LocalKaam</h2><p>Please refresh the page to load the marketplace.</p><button onclick="window.location.reload()" style="margin-top: 1rem; padding: 0.5rem 1rem; background: #1a3300; color: white; border: none; border-radius: 8px; cursor: pointer;">Refresh App</button></div>';
        }
      }
    }

    if (document.readyState === 'loading') {
      window.addEventListener('DOMContentLoaded', boot);
    } else {
      boot();
    }
  </script>
</body>
